
<!doctype html>
<html class="no-js" lang="">

<head>
  <meta charset="utf-8">
  <title>Aikido Trainer</title>
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">

  <meta name="theme-color" content="#fafafa">
</head>

<body>
<section id="app">
    <ul id="stacks">
            <li>
                <h2 class="stack-label">Attacks <span>(Kōgeki)</span></h2>
                <ul class="stack" id="attack">
                </ul>
            </li>

            <li>
                <h2 class="stack-label">Techniques <span>(Waza)</span></h2>
                <ul class="stack" id="technique">
                </ul>
            </li>
            <li id="new-cards">
                <button type="button"></button>
            </li>
            <li class="menu">
                <ul>
                    <li class="menu-item menu-item__toggle">
                        <input name="menu-autoplay" id="menu-autoplay" type="checkbox">
                        <label for="menu-autoplay">
                            <span class="menu-item__toggle-button__icon"></span>
                            <span class="menu-item__toggle-button__label label-off">Start Autoplay</span>
                            <span class="menu-item__toggle-button__label label-on">Stop Autoplay</span>
                        </label>
                    </li>
                    <li class="menu-item menu-item__toggle">
                        <input name="menu-speak" id="menu-speak" type="checkbox" checked>
                        <label for="menu-speak">
                            <span class="menu-item__toggle-button__icon"><span class="menu-item__toggle-button__icon-base"></span></span>
                            <span class="menu-item__toggle-button__label label-on">Silence Announcements</span>
                            <span class="menu-item__toggle-button__label label-off">Announce Techniques</span>
                        </label>
                    </li>
                    <li class="menu-item menu-item__toggle">
                        <input name="menu-settings" id="menu-settings" type="checkbox">
                        <label for="menu-settings" aria-label="Show Settings">
                            <span class="menu-item__toggle-button__icon"></span>
                        </label>
                    </li>
                </ul>
            </li>
    </ul>

</section>

<section id="settings">
    <h1>Settings</h1>
    <ul class="settings">
        <li id="settings-attacks">
            <h2 class="settings-label">Attacks</h2>
            <ul class="settings-set">
            </ul>
            <p class="settings-note">At least two attacks must be enabled.</p>
        </li>
        <li id="settings-techniques">
            <h2 class="settings-label">Techniques</h2>
            <ul class="settings-set">
            </ul>
            <p class="settings-note">At least two techniques must be enabled.</p>
        </li>

        <li id="settings-config">
            <h2 class="settings-label">Configuration</h2>
            <ul class="settings-set" id="settings-config-set">
            </ul>
        </li>

        <li class="menu">
            <ul>
                <li class="menu-item">
                    <label for="menu-settings">Hide Settings</label>
                </li>
            </ul>
        </li>
    </ul>

</section>

</body>

</html>
